conda_environment: "workflow/envs/nextstrain.yaml"

genesforglycosylation: ["G", "F"]

# if the build name has a "-" in it, then the pipeline assumes
# the gene is the part before the first "-", so "F-antibody-escape"
# is parsed as the gene "F".
valid_builds:  ["genome", "G", "F", "F-antibody-escape"]
builds_to_run: ["genome", "G", "F", "F-antibody-escape"]

valid_resolutions:  ["all-time", "6y", "3y"]
resolutions_to_run: ["all-time", "6y", "3y"]

valid_subtypes: ["a", "b"]
subtypes:       ["a", "b"]

# Both files must have a {a_or_b} expandable field to be replaced by "a" or "b"
# depending on if they are specified in the `subtypes` param above
inputs:
  - name: ppx_open
    metadata: "https://data.nextstrain.org/files/workflows/rsv/{a_or_b}/metadata.tsv.gz"
    sequences: "https://data.nextstrain.org/files/workflows/rsv/{a_or_b}/sequences.fasta.xz"
  - name: ppx_restricted
    metadata: "https://data.nextstrain.org/files/workflows/rsv/{a_or_b}/metadata_restricted.tsv.gz"
    sequences: "https://data.nextstrain.org/files/workflows/rsv/{a_or_b}/sequences_restricted.fasta.xz"

exclude: "config/outliers_ppx.txt"

description: "config/description.md"

strain_id_field: "accession"
display_strain_field: "strain"

# Keys are dataset patterns mapped to options. Patterns use the format
# '<subtype>/<build>/<resolution>', where each part is a literal value, '*'
# (any), or '(a|b)' (multiple). Datasets can be split into multiple samples, in
# which case the mapping goes from datasets to samples to options. When a
# dataset has been split into samples by another entry, options directly under
# the dataset pattern are applied to all samples. Datasets without explicit
# samples get one implicit sample named 'sample'. Patterns are applied
# top-to-bottom, last value wins, and null removes a previous option value.
subsample:
  '*/*/*':
    group_by:
      - year
      - country
    exclude: config/outliers_ppx.txt
  '*/genome/*':
    min_length: 10000
  '*/G/*':
    min_length: 600
  '*/F/*':
    min_length: 1200
  '*/F-antibody-escape/*':
    min_length: 1200
  'a/*/*':
    include: config/include_a.txt
  'b/*/*':
    include: config/include_b.txt
  '*/*/all-time':
    min_date: 1975-01-01
    max_sequences: 3000
    exclude_where:
      - qc.overallStatus=bad
  '*/*/6y':
    recent:
      min_date: 6Y
      max_sequences: 3000
      exclude_where:
        - qc.overallStatus=bad
    background:
      min_date: 12Y
      max_date: 6Y
      max_sequences: 300
      exclude_where:
        - qc.overallStatus=bad
        - qc.overallStatus=mediocre
  '*/*/3y':
    recent:
      min_date: 3Y
      max_sequences: 3000
      exclude_where:
        - qc.overallStatus=bad
    background:
      min_date: 12Y
      max_date: 3Y
      max_sequences: 300
      exclude_where:
        - qc.overallStatus=bad
        - qc.overallStatus=mediocre
  '*/F-antibody-escape/all-time':
    max_sequences: 2000
  '*/F-antibody-escape/(6y|3y)':
    recent:
      max_sequences: 2000
    background:
      max_sequences: 200
  'a/genome/*':
    query: "missing_data<1000 & clade.str.startswith('A.D', na=False) & genome_coverage>0.3"
  'a/G/*':
    query: "missing_data<1000 & clade.str.startswith('A.D', na=False) & G_coverage>0.3"
  'a/F/*':
    query: "missing_data<1000 & clade.str.startswith('A.D', na=False) & F_coverage>0.3"
  'a/F-antibody-escape/*':
    query: "missing_data<1000 & clade.str.startswith('A.D', na=False) & F_coverage>0.75"
  'b/genome/*':
    query: "missing_data<1000 & clade.str.startswith('B.D', na=False) & genome_coverage>0.3"
  'b/G/*':
    query: "missing_data<1000 & clade.str.startswith('B.D', na=False) & G_coverage>0.3"
  'b/F/*':
    query: "missing_data<1000 & clade.str.startswith('B.D', na=False) & F_coverage>0.3"
  'b/F-antibody-escape/*':
    query: "missing_data<1000 & clade.str.startswith('B.D', na=False) & F_coverage>0.75"

files:
  auspice_config: "config/auspice_config.json"
  auspice_config_additional_colorings: "config/auspice_config_additional_colorings.json"
  auspice_config_f_antibody_escape: "config/auspice_config_dms-defaults.json"
  auspice_config_non-genome_builds: "config/auspice_config_non-genome.json"

refine:
  coalescent: "opt"
  date_inference: "marginal"
  clock_filter_iqd: 4

ancestral:
  inference: "joint"

cds:
  F: "F"
  G: "G"
  genome: "F"
  F-antibody-escape: "F"

traits:
  columns: "country region"

frequencies:
  resolutions:
    all-time:
      min_date: 1975-01-01
    6y:
      min_date: 6Y
    3y:
      min_date: 3Y

nextclade_attributes:
  a:
    name: "RSV-A NextClade using real-time tree"
    reference_name: "hRSV/A/England/397/2017"
    accession: "EPI_ISL_412866"
  b:
    name: "RSV-B NextClade using real-time tree"
    reference_name: "hRSV/B/Australia/VIC-RCH056/2019"
    accession: "EPI_ISL_1653999"

filter_for_pre_subsample_alignment:
  min_length:
    genome: 10000
    G: 600
    F: 1200
    F-antibody-escape: 1200
  min_coverage:
    genome: 0.3
    G: 0.3
    F: 0.3
    F-antibody-escape: 0.75
  resolutions:
    all-time:
      min_date: 1975-01-01
    6y:
      min_date: 12Y
    3y:
      min_date: 12Y
    1y:
      min_date: 12Y

# configuration specific to the F deep mutational scanning antibody escape data
f_dms_data: dms-data/all_antibodies.csv
f_dms_antibodies:  # columns in `f_dms_data` with per-mutation escape
  - Clesrovimab-Fab
  - Clesrovimab-IgG
  - Nirsevimab-Fab
  - Nirsevimab-IgG
dms_only_positive_escape: true  # for DMS escape values, set any values < 0 to 0
enrich_antibody_escape:  # additional filtering for antibody escape sequences added to tree
  F-antibody-escape:  # for this build, enrich by these criteria
    nseqs_per_antibody_scoretype: 500  # add this many sequences for each antibody for total and max escape
    group_by: [country, year]  # group by these variables
    max_identical_f_prot_muts: 2  # for each group, no more than this many w identical F protein mutations
    max_identical_max_escape_mut: 6  # for each group, no more than this many w same top F escape mutation
